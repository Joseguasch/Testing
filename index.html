<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Proyectos</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      margin-bottom: 30px;
    }

    .cards {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      flex: 1;
      min-width: 200px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .number {
      font-size: 32px;
      font-weight: bold;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    th, td {
      padding: 14px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #fafafa;
    }

    .estado-riesgo {
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .cards {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <h1>Dashboard de Proyectos</h1>

  <div class="cards">
    <div class="card">
      <div>Proyectos activos</div>
      <div class="number" id="activos">-</div>
    </div>

    <div class="card">
      <div>En riesgo</div>
      <div class="number" id="riesgo">-</div>
    </div>

    <div class="card">
      <div>Avance promedio</div>
      <div class="number" id="promedio">-</div>
    </div>
  </div>

  <table id="tabla-proyectos">
    <thead>
      <tr>
        <th>Proyecto</th>
        <th>Estado</th>
        <th>Avance</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="app.js"></script>

</body>
</html>
